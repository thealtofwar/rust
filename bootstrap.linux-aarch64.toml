# See bootstrap.example.toml for documentation of available options
#
profile = "compiler"  # Includes one of the default files in src/bootstrap/defaults
change-id = 148671

[build]
submodules = false
host = ["aarch64-unknown-linux-gnu"]
target = ["thumbv6m-none-eabi", "thumbv7em-none-eabihf", "aarch64-unknown-linux-gnu"]
sanitizers = true

[llvm]
download-ci-llvm = false
use-linker = "mold"

[target.x86_64-unknown-linux-gnu]
cc = "clang"
cxx = "clang++"

[target.thumbv7em-none-eabihf]
profiler = false
cc = "clang"
cxx = "clang++"

[target.thumbv6m-none-eabi]
profiler = false
cc = "clang"
cxx = "clang++"
rustflags = ["-Zfixed-r12", "-Zsanitizer=shadow-call-stack"]
